name: ChoreBlitz
options:
  bundleIdPrefix: com.brandonbourne
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
packages:
  ChoreKit:
    path: ChoreKit
settings:
  base:
    DEVELOPMENT_TEAM: 85QS8LM6D3
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
  configs:
    Debug:
      CLOUDKIT_ENV: Development
    Release:
      CLOUDKIT_ENV: Production
targets:
  ChoreBlitz:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    dependencies:
      - package: ChoreKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandonbourne.ChoreBlitz
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Chore Blitz
        # Mac companion: the same app runs on the Mac via Mac Catalyst.
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Chore Blitz
        UILaunchScreen: {}
        NSCameraUsageDescription: Take a photo of a room so Chore Blitz can suggest chores. The photo stays on your phone.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: iOS/ChoreBlitz.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.brandonbourne.ChoreBlitz]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-environment: $(CLOUDKIT_ENV)
        # Required for the Mac (Catalyst) build; ignored on iPhone.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
  ChoreBlitzTV:
    type: application
    platform: tvOS
    sources: [tvOS, Shared]
    dependencies:
      - package: ChoreKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandonbourne.ChoreBlitzTV
        TARGETED_DEVICE_FAMILY: "3"
    info:
      path: tvOS/Info.plist
      properties:
        CFBundleDisplayName: Chore Blitz
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
    entitlements:
      path: tvOS/ChoreBlitzTV.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.brandonbourne.ChoreBlitz]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-environment: $(CLOUDKIT_ENV)
