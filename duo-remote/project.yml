name: DuoRemote
options:
  bundleIdPrefix: com.brandonbourne
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 85QS8LM6D3
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  DuoRemote:
    type: application
    platform: iOS
    sources: [App, RFB, UI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandonbourne.DuoRemote
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Mac Remote
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        OTHER_LDFLAGS: ["-lz"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mac Remote
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Mac Remote finds and connects to your Mac's Screen Sharing on your network.
        NSBonjourServices: [_rfb._tcp]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
